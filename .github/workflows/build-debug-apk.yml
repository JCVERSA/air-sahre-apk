name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # AGP 8.7.x requires JDK 17 minimum; app/build.gradle.kts targets JVM 21
      # (sourceCompatibility/targetCompatibility/kotlinOptions.jvmTarget = "21"),
      # so JDK 21 satisfies both.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # No gradlew wrapper is present in this repository, so Gradle is
      # installed directly. AGP 8.7 requires Gradle 8.9 minimum (per
      # Android's official AGP 8.7.0 release notes) — 8.9 is used here.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # app/build.gradle.kts wires BOTH the debug and release signingConfig
      # to file("${rootDir}/debug.keystore") using the standard Android
      # debug-keystore credentials (storePassword/keyPassword = "android",
      # alias = "androiddebugkey"). That file is not committed to the repo,
      # so it is generated here with keytool using the exact same standard
      # values — functionally identical to the keystore Android Studio
      # would auto-generate locally.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: airqr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
